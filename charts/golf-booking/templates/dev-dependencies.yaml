{{- if .Values.dev.enabled }}
# Dev stand-ins for RDS PostgreSQL and SQS, the same images Docker Compose uses.
# No persistent volume: data is lost when the pod restarts. Fine for a nightly-destroyed cluster.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-dependencies
  labels:
    {{- include "golf.labels" . | nindent 4 }}
data:
  # One database and one login per service (ADR 0002), as in local/postgres-init.sql.
  init.sql: |
    CREATE USER courses WITH PASSWORD 'courses';
    CREATE DATABASE courses OWNER courses;
    CREATE USER bookings WITH PASSWORD 'bookings';
    CREATE DATABASE bookings OWNER bookings;
  elasticmq.conf: |
    include classpath("application.conf")
    queues {
      booking-created-dlq {}
      booking-created {
        defaultVisibilityTimeout = 30 seconds
        deadLettersQueue {
          name = "booking-created-dlq"
          maxReceiveCount = 3
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "golf.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: golf-booking }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: {{ .Values.dev.postgresPassword | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 5
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: init
          configMap: { name: dev-dependencies, items: [{ key: init.sql, path: init.sql }] }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "golf.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  labels:
    app.kubernetes.io/name: elasticmq
    {{- include "golf.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: elasticmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: elasticmq, app.kubernetes.io/part-of: golf-booking }
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.6.11
          ports: [{ name: sqs, containerPort: 9324 }]
          readinessProbe:
            tcpSocket: { port: sqs }
            periodSeconds: 5
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts:
            - { name: config, mountPath: /opt/elasticmq.conf, subPath: elasticmq.conf }
      volumes:
        - name: config
          configMap: { name: dev-dependencies }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  labels:
    {{- include "golf.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: elasticmq }
  ports: [{ name: sqs, port: 9324, targetPort: sqs }]
{{- end }}
