# Docker Compose only: nginx stands in for the ALB and routes /api/* to the APIs.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve service names per request through Docker's DNS, so a restarted API
    # container (new IP) doesn't leave nginx proxying to the old address.
    resolver 127.0.0.11 valid=10s;
    set $courses_api http://courses-api:8000;
    set $bookings_api http://bookings-api:8000;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/courses  { proxy_pass $courses_api; }
    location /api/bookings { proxy_pass $bookings_api; }
    location / { try_files $uri /index.html; }
}
