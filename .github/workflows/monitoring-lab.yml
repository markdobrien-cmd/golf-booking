# CI for the Checkmk-to-Nagios lab (ADR 0010). Runs only when the lab's files change.
#   scripts     lint and unit-test the exporter and the comparison script
#   terraform   fmt, validate and the offline tests for infra/envs/monlab (no AWS login)
#   lab         the whole migration in containers: seed Checkmk, export, build Nagios, compare.
#               A failed comparison fails the job, the same gate you'd put on a real cut-over.
name: Monitoring lab

on:
  pull_request:
    paths: ["monitoring-lab/**", "infra/envs/monlab/**", ".github/workflows/monitoring-lab.yml"]
  push:
    branches: [main]
    paths: ["monitoring-lab/**", "infra/envs/monlab/**", ".github/workflows/monitoring-lab.yml"]
  workflow_dispatch:

concurrency:
  group: monitoring-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monitoring-lab/scripts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitoring-lab/scripts/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check --config ../../ruff.toml .
          ruff format --check --config ../../ruff.toml .
      - name: Unit tests
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/envs/monlab
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  lab:
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: monitoring-lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible and the collections
        run: |
          pip install ansible-core==2.19.4
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Syntax-check every playbook
        working-directory: monitoring-lab/ansible
        run: |
          for p in 0*.yml; do
            ansible-playbook --syntax-check -i ../test/inventory.yml -e @../test/vars.yml "$p"
          done
      - name: Run the migration in containers
        run: ./test/run.sh
      - name: Show the migration report
        if: always()
        run: cat ansible/migration/report.md || true
      - name: Clean up
        if: always()
        run: ./test/run.sh down
