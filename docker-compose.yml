# Local stack: the four services plus stand-ins for RDS (Postgres) and SQS (ElasticMQ).
# Open http://localhost:8080 after `make up`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./local/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro
    ports: ["9324:9324"]

  courses-api:
    build: services/courses-api
    environment:
      DATABASE_URL: postgresql://courses:courses@postgres:5432/courses
    depends_on:
      postgres: { condition: service_healthy }

  bookings-api:
    build: services/bookings-api
    environment:
      DATABASE_URL: postgresql://bookings:bookings@postgres:5432/bookings
      COURSES_API_URL: http://courses-api:8000
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/booking-created
      AWS_ENDPOINT_URL: http://elasticmq:9324
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      postgres: { condition: service_healthy }
      elasticmq: { condition: service_started }
      courses-api: { condition: service_started }

  notifications-worker:
    build: services/notifications-worker
    environment:
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/booking-created
      AWS_ENDPOINT_URL: http://elasticmq:9324
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      elasticmq: { condition: service_started }

  web:
    build: services/web
    volumes:
      - ./services/web/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]
    depends_on: [courses-api, bookings-api]
