nagios_group_checks:
- name: Backup_age
  nrpe: mrpe_backup_age
  shared_plugin: Backup_age
- name: CPU load
  nrpe: check_load
  command: /usr/lib/nagios/plugins/check_load -r -w 999,999,5 -c 999,999,10
- name: NRPE agent
  nrpe: null
  replaces: Check_MK Agent
- name: Filesystem /
  nrpe: check_disk_root
  command: /usr/lib/nagios/plugins/check_disk -w 9% -c 4% -p /
- name: Filesystem /boot
  nrpe: check_disk_boot
  command: /usr/lib/nagios/plugins/check_disk -w 9% -c 4% -p /boot
- name: Filesystem /boot/efi
  nrpe: check_disk_boot_efi
  command: /usr/lib/nagios/plugins/check_disk -w 9% -c 4% -p /boot/efi
- name: Filesystem /sys/firmware/efi/efivars
  nrpe: check_disk_sys_firmware_efi_efivars
  command: /usr/lib/nagios/plugins/check_disk -w 9% -c 4% -p /sys/firmware/efi/efivars
- name: Memory
  nrpe: check_mem
  command: /usr/local/lib/nagios/plugins/check_mem -w 80 -c 90
