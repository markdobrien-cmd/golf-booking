# Step 3: build the "existing" Checkmk configuration.
#
# At SIG this config was made by hand in the Checkmk GUI over the years. Here Ansible plays the
# part of those clicks so the lab is repeatable; pretend you inherited it. It has the usual
# layering: a default in the top folder, an override in a subfolder, and a one-off tweak on a
# single host that nobody remembers making. Step 4 has to work all of that out.
- name: Create folders, hosts and rules in Checkmk, then discover and activate
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/checkmk.general.checkmk:
      server_url: "{{ checkmk_api_url }}"
      site: "{{ checkmk_site }}"
      api_user: "{{ checkmk_api_user }}"
      api_secret: "{{ checkmk_api_secret }}"
  vars:
    targets: "{{ groups['targets'] }}"
  tasks:
    - name: Folders
      checkmk.general.folder:
        path: "{{ item.path }}"
        name: "{{ item.title }}"
        state: present
      loop:
        - { path: /linux, title: Linux servers }
        - { path: /linux/app, title: Application servers }
        - { path: /linux/db, title: Database servers }

    - name: Hosts, filed by their monitoring_folder tag
      checkmk.general.host:
        name: "{{ item }}"
        folder: "/linux/{{ hostvars[item].group_names | select('match', '^folder_') | first | regex_replace('^folder_', '') }}"
        attributes:
          ipaddress: "{{ hostvars[item].private_ip }}"
          tag_criticality: "{{ 'prod' if item.startswith('db') else 'test' }}"
          labels:
            lab/role: "{{ hostvars[item].group_names | select('match', '^folder_') | first | regex_replace('^folder_', '') }}"
        state: present
      loop: "{{ targets }}"

    # Filesystem levels are "used %". The db override is a dictionary rule in a subfolder:
    # Checkmk evaluates subfolder rules first, and the first rule to set a key wins.
    - name: Filesystem levels, default for all Linux servers
      checkmk.general.rule:
        ruleset: checkgroup_parameters:filesystem
        rule:
          location: { folder: /linux, position: bottom }
          properties: { description: "Default filesystem levels" }
          conditions: { host_tags: [], host_labels: [], service_labels: [] }
          value_raw: "{'levels': (80.0, 90.0)}"
        state: present

    - name: Filesystem levels, relaxed for the database servers
      checkmk.general.rule:
        ruleset: checkgroup_parameters:filesystem
        rule:
          location: { folder: /linux/db, position: bottom }
          properties: { description: "DB volumes run full by design" }
          conditions: { host_tags: [], host_labels: [], service_labels: [] }
          value_raw: "{'levels': (90.0, 95.0)}"
        state: present

    - name: CPU load, a one-off tweak on app02
      checkmk.general.rule:
        ruleset: checkgroup_parameters:cpu_load
        rule:
          location: { folder: /linux, position: top }
          properties: { description: "Tightened after an incident (nobody remembers which)" }
          conditions:
            host_name: { match_on: [app02], operator: one_of }
            host_tags: []
            host_labels: []
            service_labels: []
          value_raw: "{'levels15': (2.0, 4.0)}"
        state: present

    # New hosts only reach the monitoring core once changes are activated, so activate before
    # asking Checkmk to discover their services, and again afterwards to start monitoring them.
    - name: Activate the new hosts and rules
      checkmk.general.activation:
        force_foreign_changes: true
        redirect: true  # wait until the activation has finished
      run_once: true

    # Checkmk 2.x agents talk to the server over TLS, but only once they are registered, and a
    # host can only register after it exists in Checkmk (above). Until then the "Check_MK Agent"
    # service warns "TLS is not activated on monitored host". The agent role can't do this in
    # step 2, because the hosts don't exist yet. (Containers run the agent without its controller,
    # so there's nothing to register there.)
    - name: See which agents are already registered
      ansible.builtin.command: cat /var/lib/cmk-agent/registered_connections.json
      delegate_to: "{{ item }}"
      become: true
      loop: "{{ targets }}"
      register: agent_connections
      changed_when: false
      failed_when: agent_connections.rc not in [0, 1]
      when: not lab_containers

    - name: Register each agent with the server for TLS
      ansible.builtin.command: >-
        cmk-agent-ctl register --hostname {{ item.item }}
        --server {{ checkmk_private_address }}:{{ checkmk_agent_receiver_port }}
        --site {{ checkmk_site }} --user {{ checkmk_api_user }} --password {{ checkmk_api_secret }}
        --trust-cert
      delegate_to: "{{ item.item }}"
      become: true
      loop: "{{ agent_connections.results }}"
      loop_control: { label: "{{ item.item }}" }
      no_log: true  # the command line carries the API password
      changed_when: true
      when:
        - not lab_containers
        - checkmk_private_address not in item.stdout | default('')

    # Bulk mode with a full scan: asks each agent for fresh data. (Single-host discovery of a
    # brand-new host can leave everything "undecided", because there's no agent data cached yet.)
    - name: Discover services on every host
      checkmk.general.discovery:
        hosts: "{{ targets }}"
        state: fix_all
        do_full_scan: true

    - name: Activate the discovered services
      checkmk.general.activation:
        force_foreign_changes: true
        redirect: true  # wait until the activation has finished
      run_once: true
